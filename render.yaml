services:
  - type: web
    name: reading-salon-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/v1/health/ready
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: APP_NAME
        value: The Reading Salon API
      - key: DATABASE_URL
        fromDatabase:
          name: reading-salon-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_ISSUER
        value: the-reading-salon
      - key: JWT_AUDIENCE
        value: the-reading-salon-clients
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: REFRESH_TOKEN_EXPIRE_MINUTES
        value: "43200"
      - key: BCRYPT_ROUNDS
        value: "12"
      - key: BACKEND_CORS_ORIGINS
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_FROM_ADDRESS
        sync: false
      - key: SMTP_FROM_NAME
        value: The Reading Salon

  - type: web
    name: reading-salon-frontend
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: ./frontend/dist
    pullRequestPreviewsEnabled: true
    envVars:
      - key: VITE_API_BASE_URL
        sync: false

databases:
  - name: reading-salon-db
    plan: free
    databaseName: salon
    user: salon
