[project]
name = "reading-salon-backend"
version = "0.1.0"
description = "FastAPI backend for The Reading Salon."
requires-python = ">=3.12,<3.15"
dependencies = [
  "alembic>=1.17.0",
  "bcrypt>=5.0.0",
  "fastapi[standard]>=0.125.0",
  "psycopg[binary]>=3.3.0",
  "pydantic-settings>=2.12.0",
  "pyjwt>=2.10.0",
  "sqlalchemy>=2.0.45",
]

[build-system]
requires = ["setuptools>=80.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[project.optional-dependencies]
dev = [
  "pytest>=9.0.0",
  "ruff>=0.14.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
