[project]
name = "reading-salon-backend"
version = "0.2.0"
description = "FastAPI backend for The Reading Salon."
requires-python = ">=3.12,<3.15"
dependencies = [
  "alembic>=1.17.0",
  "bcrypt>=5.0.0",
  "email-validator>=2.2.0",
  "fastapi>=0.125.0",
  "psycopg[binary,pool]>=3.3.0",
  "python-multipart>=0.0.12",
  "pydantic-settings>=2.12.0",
  "pyjwt>=2.10.0",
  "sqlalchemy>=2.0.45",
  "typer>=0.12.0",
  "uvicorn[standard]>=0.30.0",
]

[build-system]
requires = ["setuptools>=80.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[project.scripts]
salon = "app.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=9.0.0",
  "pytest-postgresql>=6.0.0",
  "ruff>=0.14.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
