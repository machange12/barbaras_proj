name: reading-salon

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: salon
      POSTGRES_PASSWORD: salon
      POSTGRES_DB: salon
    ports:
      - "5432:5432"
    volumes:
      - salon_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U salon -d salon"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports:
      - "1025:1025"
      - "8025:8025"

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+psycopg://salon:salon@db:5432/salon
      ENVIRONMENT: local
      JWT_SECRET_KEY: local-development-secret-please-replace-32-chars-minimum
    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    environment:
      DATABASE_URL: postgresql+psycopg://salon:salon@db:5432/salon
      ENVIRONMENT: local
      JWT_SECRET_KEY: local-development-secret-please-replace-32-chars-minimum
      SMTP_HOST: mailhog
      SMTP_PORT: "1025"
      SMTP_FROM_ADDRESS: salon@example.test
      SMTP_FROM_NAME: "The Reading Salon"
      BACKEND_CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  salon_pgdata:
